name: Android
on:
  push:
    paths: ['android/**', 'tools/check-locales.py', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'tools/check-locales.py', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 tools/check-locales.py
      - run: bash gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: drzemka-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
